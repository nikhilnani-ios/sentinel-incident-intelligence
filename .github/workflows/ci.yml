name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

permissions:
  contents: read

jobs:
  services:
    name: Services · build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify formatting
        working-directory: services
        run: mvn -B spotless:check

      - name: Build and test
        working-directory: services
        run: mvn -B verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: services/**/target/surefire-reports/TEST-*.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco
          path: services/**/target/site/jacoco/

  web:
    name: Web · lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      - working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - working-directory: web
        run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Dependency vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # The build fails only on issues that are both severe and fixable; unactionable noise
          # trains people to ignore the whole job.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Render kustomize output
        run: kubectl kustomize deploy/k8s/base > /tmp/rendered.yaml

      - name: Validate against the API schema
        uses: instrumenta/kubeval-action@master
        with:
          files: /tmp/rendered.yaml

  images:
    name: Build and push images
    needs: [services, web, security, manifests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - { name: ingest-service, context: ./services, service: ingest-service }
          - { name: correlation-service, context: ./services, service: correlation-service }
          - { name: incident-service, context: ./services, service: incident-service }
          - { name: insight-service, context: ./services, service: insight-service }
          - { name: web, context: ./web, service: "" }

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
