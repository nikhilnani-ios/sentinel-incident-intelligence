# Committed as an example only. Real clusters get these from External Secrets or the cloud provider's
# secret store — never from a manifest in git.
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
type: Opaque
stringData:
  DATABASE_URL: jdbc:postgresql://sentinel-db.internal:5432/sentinel
  DATABASE_USER: sentinel
  DATABASE_PASSWORD: replace-me
  JWT_SECRET: replace-me-with-at-least-32-bytes-of-entropy
  ANTHROPIC_API_KEY: ""
