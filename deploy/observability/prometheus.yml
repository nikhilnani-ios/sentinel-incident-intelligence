global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: sentinel

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: sentinel-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ingest-service:8080
          - correlation-service:8080
          - incident-service:8080
          - insight-service:8080

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
