spring:
  application:
    name: insight-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    # WebFlux is a dependency for WebClient only; this service is a servlet app like the others.
    web-application-type: servlet
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${DATABASE_USER:sentinel}
    password: ${DATABASE_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: 8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${PORT:8080}
  shutdown: graceful

sentinel:
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-production-this-is-32-bytes-long}
  insight:
    # demo: curated, deterministic and free; stub: explicit placeholder; anthropic: live API.
    mode: ${INSIGHT_MODE:demo}
    max-output-tokens: 2000
    postmortem-max-output-tokens: 4000
    anthropic:
      # Absent by default. With no key the StubLlmClient takes over and the whole pipeline still
      # runs end to end, which is what makes the local demo work with no credentials.
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: https://api.anthropic.com
      # Pin the model snapshot so an upstream alias cannot change incident analysis unexpectedly.
      model: ${INSIGHT_MODEL:claude-sonnet-4-20250514}
      timeout: PT60S

resilience4j:
  retry:
    instances:
      llm:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - io.sentinel.insight.llm.AnthropicLlmClient$LlmUnavailableException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - io.sentinel.insight.llm.AnthropicLlmClient$LlmRequestRejectedException
  circuitbreaker:
    instances:
      llm:
        sliding-window-size: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 45s
        slow-call-rate-threshold: 80

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: insight-service
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.1}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  service:
    name: insight-service

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{tenantId:-}]"
