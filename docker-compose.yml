name: sentinel

# One command brings up the whole platform: infrastructure, four services, the web app and the
# observability stack. Everything is pinned and health-gated so `up` either works or fails loudly
# rather than producing a half-started stack that looks fine.

x-service-base: &service-base
  build:
    context: ./services
    dockerfile: Dockerfile
  environment: &service-env
    SPRING_PROFILES_ACTIVE: local
    # Every service listens on the same container port. Host ports remain service-specific below.
    PORT: 8080
    JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    DATABASE_URL: jdbc:postgresql://postgres:5432/sentinel
    DATABASE_USER: sentinel
    DATABASE_PASSWORD: sentinel
    REDIS_URL: redis://redis:6379
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_SDK_DISABLED: "true"
    JWT_SECRET: local-development-secret-at-least-32-bytes
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports: ["5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports: ["9093:9092"]
    environment:
      # KRaft: no ZooKeeper. One less container and one less thing to explain.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      # Kafka storage IDs are 22-character base64 UUIDs, not arbitrary names.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 5s
      retries: 12

  ingest-service:
    <<: *service-base
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE: ingest-service }
    ports: ["8081:8080"]

  correlation-service:
    <<: *service-base
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE: correlation-service }
    ports: ["8082:8080"]

  incident-service:
    <<: *service-base
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE: incident-service }
    ports: ["8083:8080"]

  insight-service:
    <<: *service-base
    build:
      context: ./services
      dockerfile: Dockerfile
      args: { SERVICE: insight-service }
    environment:
      <<: *service-env
      # Unset by default. Without it the stub client runs and the demo still works end to end.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INSIGHT_MODEL: ${INSIGHT_MODEL:-claude-sonnet-4-20250514}
    ports: ["8084:8080"]

  web:
    build:
      context: ./web
    environment:
      INCIDENT_API_URL: http://incident-service:8080
      INSIGHT_API_URL: http://insight-service:8080
    ports: ["3000:3000"]
    depends_on: [incident-service, insight-service]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./deploy/observability/otel-collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4317:4317", "8889:8889"]

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes: ["./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: sentinel
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
